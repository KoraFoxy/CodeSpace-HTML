    <div class="text text-center">
        <p class="h1 text-dark"><strong>Registration page</strong></p>
    </div>   

    <form>
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-12 col-md-6 my-3">
            <label for="InputName" class="form-label">First name</label>
            <input type="text" class="form-control" id="InputName">
          </div>

          <div class="col-12 col-md-6 my-3">
            <label for="InputSurname" class="form-label">Surname</label>
            <input type="text" class="form-control" id="InputSurname">
          </div>

          <div class="col-12 col-md-6 my-3">
            <label for="InputUsername" class="form-label">Username</label>
            <input type="text" class="form-control" id="InputUsername">
          </div>

          <div class="col-12 col-md-6 my-3">
            <label for="InputEmail" class="form-label">Email</label>
            <input type="email" class="form-control" id="InputEmail" aria-describedby="emailHelp">
          </div>

          <div class="col-12 col-md-6 my-3">
            <label for="InputPassword" class="form-label">Enter your Password</label>
            <input type="password" class="form-control" id="InputPassword">
          </div>

          <div class="col-12 col-md-6 my-3">
            <label for="InputPasswordConfirm" class="form-label">Confirm Password</label>
            <input type="password" class="form-control" id="InputPasswordConfirm">
          </div>

          <div class="col-12 form-check my-3">
            <input type="checkbox" class="form-check-input" id="Check">
            <label class="form-check-label" for="Check">Remember me</label>
          </div>

          <div class="col-6 my-3">
            <button type="submit" class="btn bg-success text-white border-0 w-100">Submit</button>
          </div>

          <div class="col-12 my-3 text-center">
            <a href="login_highland.html" class="btn" style="background-color: #b37e00; color: white;">Already have an account? Login</a>
            <a href="registration_highlands.html" class="btn" style="background-color: #e6a103; color: white;">Create a new account</a>
          </div>

        </div>
      </div>
    </form>
